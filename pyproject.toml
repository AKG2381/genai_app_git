[project]
name = "genai_app"
version = "0.1.0"
description = "A GenAI app using FastAPI and related dependencies."
requires-python = ">=3.9"
dependencies = [
	"fastapi==0.115.5",
	"pydantic==2.9.2",
	"google-genai==1.5.0",
	"uvicorn==0.30.1",
	"python-dotenv==1.0.0",
	"huggingface_hub"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
